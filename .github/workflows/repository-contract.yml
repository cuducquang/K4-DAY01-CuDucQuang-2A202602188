name: Repository contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Normalize executed Colab notebook for structural checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("notebooks/day1_understand_labels.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          for index, cell in enumerate(notebook.get("cells", [])):
              # Colab may omit an id on the first cell and stores execution output.
              cell.setdefault("id", f"cell-{index:03d}")
              if cell.get("cell_type") == "code":
                  cell["execution_count"] = None
                  cell["outputs"] = []
          path.write_text(json.dumps(notebook, ensure_ascii=False, indent=1) + "\n", encoding="utf-8")
          PY
      - name: Validate notebook and student artifacts
        run: python -m unittest discover -s tests -v
